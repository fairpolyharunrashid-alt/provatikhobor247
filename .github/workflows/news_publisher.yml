name: Provati Khobor 24 - 24/7 Cloud News Publisher

on:
  schedule:
    # Runs every hour at minute 0 (24 times/day)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: news-publishing
  cancel-in-progress: false

jobs:
  publish-news:
    name: Scout & Publish News Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Cloud News Cycle (Sports + Rotating Section)
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: |
          python main.py --cloud-cycle
